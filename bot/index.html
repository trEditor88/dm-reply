<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>야구봇 — 주소가 바뀌었어요</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="../icon.svg">
<style>
body{margin:0;font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,-apple-system,sans-serif;color:#1D1D1F;background:#fff;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:64px 20px}
h1{font-size:26px;margin:0 0 10px;letter-spacing:-.01em}
p{color:#6E6E73;margin:0 0 22px}
.card{background:#F5F5F7;border-radius:18px;padding:22px}
.url{font-weight:700;color:#1D1D1F;overflow-wrap:anywhere;margin:0 0 16px}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:11px 22px;border-radius:9999px;background:#0066CC;color:#fff;font-weight:600;text-decoration:none}
a.btn:focus-visible{outline:2px solid #0071E3;outline-offset:2px}
</style>
</head>
<body>
<main class="wrap">
  <h1>⚾ 야구봇 주소가 바뀌었어요</h1>
  <p>야구봇 사이트는 이제 HEO Works 안에 있어요. 새 주소에서 HEO Works 계정으로 다시 로그인해 주세요. 즐겨찾기도 새 주소로 바꿔 주세요.</p>
  <div class="card">
    <div class="url">heoworks.pages.dev/baseball</div>
    <a class="btn" href="https://heoworks.pages.dev/baseball/" rel="noopener">새 야구봇 사이트로 가기</a>
  </div>
</main>
<script>
// 예전 주소로 받은 일회용 로그인 코드(#sso=…)가 주소창·기록에 남지 않게 지움(새 주소로 넘기지 않음)
if (location.hash) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
</script>
</body>
</html>
